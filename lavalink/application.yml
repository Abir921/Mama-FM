server:
  port: 2333
  # Loopback locally; containers must bind 0.0.0.0 to be reachable from the
  # bot container. The port is never published outside the compose network.
  address: "${LAVALINK_ADDRESS:127.0.0.1}"

lavalink:
  server:
    password: "${LAVALINK_PASSWORD:youshallnotpass}"
    sources:
      youtube: false   # built-in source is deprecated; youtube-plugin below replaces it
      soundcloud: true
      bandcamp: true
      twitch: true
      vimeo: true
      http: true
  plugins:
    - dependency: "dev.lavalink.youtube:youtube-plugin:1.18.2"
      repository: "https://maven.lavalink.dev/releases"

plugins:
  youtube:
    enabled: true
    oauth:
      # Read from the environment so the token never lands in this committed
      # file. start-lavalink.ps1 exports it from .env, which is gitignored.
      # Leave YOUTUBE_REFRESH_TOKEN unset to be prompted with a device code.
      enabled: true
      refreshToken: "${YOUTUBE_REFRESH_TOKEN:}"
      skipInitialization: false
    clients:
      # TV is the OAuth-compatible client; without it the token is never used.
      - TV
      - MUSIC
      - ANDROID_VR
      - WEB
      - WEBEMBEDDED

logging:
  level:
    root: INFO
    lavalink: INFO
